@import { AppIconComponent } from '../app-icon/app-icon.xd.component.ts'

<dialog aria-labelledby="password-title" (click)="onBackdropClick($event)" (close)="onClosed(passwordForm)">
  <header>
    <h2 id="password-title">Cambia password</h2>
    <button type="button" class="close" aria-label="Chiudi" (click)="close()">
      <app-icon name="close" />
    </button>
  </header>
  <form
    #passwordForm
    novalidate
    (submit)="submit($event, passwordForm, currentField.value, newField.value, confirmField.value)"
  >
    <label>
      Password attuale
      <input #currentField type="password" autocomplete="current-password" />
    </label>
    <label>
      Nuova password
      <input #newField type="password" autocomplete="new-password" />
    </label>
    <label>
      Ripeti la nuova password
      <input #confirmField type="password" autocomplete="new-password" />
    </label>
    @if (error()) {
      <p class="error">{ error() }</p>
    }
    @if (changed()) {
      <p class="success">
        <app-icon name="check-circle" />
        Password cambiata.
      </p>
    }
    <div class="actions">
      <button type="button" class="ghost" (click)="close()">{ changed() ? 'Chiudi' : 'Annulla' }</button>
      <button
        @if (busy()) {
          disabled
        }
        type="submit"
        class="primary"
      >
        Salva password
      </button>
    </div>
  </form>
</dialog>
